name: Python checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m compileall -q niruflow
      - name: Unit tests
        run: python -m unittest discover -s tests -v
  gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies
        run: python -m pip install '.[desktop]'
      - name: Install Qt runtime
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Offscreen GUI smoke
        env:
          QT_QPA_PLATFORM: offscreen
          NIRUFLOW_SMOKE: '1'
        run: timeout 20 python -m niruflow desktop
